[package]
name = "atua-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Browser WASM networking: HTTPS fetch and raw TCP/TLS via Wisp relay"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.2", features = ["js"] }
rustls-pki-types = { version = "1", features = ["web"] }
webpki-roots = "0.26"
httparse = "1.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
